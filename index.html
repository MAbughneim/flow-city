<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow City v2</title>

<style>

body{
    margin:0;
    background:#050816;
    overflow:hidden;
    color:white;
    font-family:Segoe UI;
}

.header{
    height:70px;
    background:#08111f;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    font-weight:bold;
    color:#00ffff;
    box-shadow:0 0 20px #00ffff;
}

.city{
    position:relative;
    width:100vw;
    height:calc(100vh - 70px);
}

/* Buildings */

.building{
    position:absolute;
    border-radius:10px;
    text-align:center;
    padding-top:15px;
    font-weight:bold;
    box-shadow:0 0 25px currentColor;
}

#tm{
    left:100px;
    top:180px;
    width:160px;
    height:220px;
    background:#1d4ed8;
    color:#00ffff;
}

#warehouse{
    left:450px;
    top:220px;
    width:180px;
    height:180px;
    background:#14532d;
    color:#00ff88;
}

#approval{
    left:850px;
    top:170px;
    width:180px;
    height:250px;
    background:#7c2d12;
    color:#ffaa00;
}

#report{
    left:1250px;
    top:200px;
    width:180px;
    height:200px;
    background:#991b1b;
    color:#ff4444;
}

/* Road */

.road{
    position:absolute;
    left:0;
    right:0;
    bottom:180px;
    height:100px;
    background:#222;
}

.line{
    position:absolute;
    top:45px;
    width:100%;
    border-top:6px dashed yellow;
}

/* Truck */

#truck{
    position:absolute;
    width:70px;
    height:40px;
    background:cyan;
    border-radius:8px;
    bottom:210px;
    left:120px;
    box-shadow:0 0 20px cyan;
    transition:all 3s linear;
}

/* Cargo */

#box{
    position:absolute;
    width:30px;
    height:30px;
    background:orange;
    display:none;
}

/* Log */

.panel{
    position:absolute;
    right:20px;
    top:100px;
    width:300px;
    height:350px;
    background:rgba(0,0,0,.5);
    border:1px solid cyan;
    padding:15px;
    overflow:auto;
}

.panel h3{
    color:cyan;
}

.log{
    margin-bottom:10px;
}

.control{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:20px;
    width:350px;
    padding:20px;
    text-align:center;
    border:1px solid cyan;
    box-shadow:0 0 20px cyan;
}

</style>
</head>

<body>

<div class="header">
🏙 FLOW CITY V2
</div>

<div class="city">

<div id="tm" class="building">
T&M FLOW
</div>

<div id="warehouse" class="building">
WAREHOUSE
</div>

<div id="approval" class="building">
APPROVAL TOWER
</div>

<div id="report" class="building">
REPORT CENTER
</div>

<div class="road">
<div class="line"></div>
</div>

<div id="truck">🚚</div>
<div id="box"></div>

<div class="panel">
<h3>LIVE ACTIVITY</h3>
<div id="logs"></div>
</div>

<div class="control">
<h2>CONTROL CENTER</h2>
<div id="status">Waiting...</div>
</div>

</div>

<script>

const truck=document.getElementById("truck");
const logs=document.getElementById("logs");
const status=document.getElementById("status");
const box=document.getElementById("box");

function log(message){

const item=document.createElement("div");
item.className="log";

const time=new Date().toLocaleTimeString();

item.innerHTML=time + " - " + message;

logs.prepend(item);

}

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

async function runFlow(){

status.innerHTML="T&M Flow Started";
log("T&M Flow Started");

truck.style.left="120px";

await sleep(2000);

status.innerHTML="Driving to Warehouse";
log("Driving to Warehouse");

truck.style.left="500px";

await sleep(3500);

status.innerHTML="Loading Materials";
log("Loading Materials");

box.style.display="block";
box.style.left="560px";
box.style.top="420px";

await sleep(2000);

box.style.display="none";

status.innerHTML="Driving to Approval Tower";
log("Driving to Approval Tower");

truck.style.left="900px";

await sleep(3500);

status.innerHTML="Approval Processing";
log("Approval Processing");

await sleep(2000);

status.innerHTML="Driving to Report Center";
log("Driving to Report Center");

truck.style.left="1300px";

await sleep(3500);

status.innerHTML="Report Delivered ✅";
log("Report Delivered ✅");

await sleep(3000);

runFlow();

}

runFlow();

</script>

</body>
</html>
