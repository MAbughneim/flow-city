    <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flow City Cyber Edition</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI;
    background:#050816;
    overflow:hidden;
    color:white;
}

/* Header */

.header{
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    font-weight:bold;
    background:#08111f;
    border-bottom:2px solid #00ffff;
    box-shadow:0 0 20px #00ffff;
}

/* City */

.city{
    width:100vw;
    height:calc(100vh - 80px);
    position:relative;
    background:
      radial-gradient(circle at top,#142c4d,#050816);
}

/* Buildings */

.building{
    position:absolute;
    border-radius:10px;
    text-align:center;
    padding-top:10px;
    color:white;
    font-weight:bold;

    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:translateY(-5px);
    }
}

.building::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:10px;
    box-shadow:0 0 25px currentColor;
}

/* Buildings */

.tm{
    width:180px;
    height:250px;
    left:80px;
    top:180px;
    background:#1d4ed8;
    color:#00ffff;
}

.material{
    width:180px;
    height:220px;
    left:340px;
    top:250px;
    background:#14532d;
    color:#00ff88;
}

.ai{
    width:180px;
    height:280px;
    left:600px;
    top:150px;
    background:#4c1d95;
    color:#ff00ff;
}

.approvals{
    width:180px;
    height:260px;
    right:330px;
    top:170px;
    background:#7c2d12;
    color:#ff8800;
}

.reporting{
    width:180px;
    height:240px;
    right:80px;
    top:200px;
    background:#991b1b;
    color:#ff4444;
}

/* Control Center */

.control{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:40px;

    width:300px;
    height:150px;

    border:2px solid #00ffff;
    border-radius:20px;

    text-align:center;
    padding-top:20px;

    background:rgba(0,0,0,.4);

    box-shadow:0 0 30px #00ffff;
}

/* Hover Truck */

.truck{
    width:60px;
    height:30px;

    position:absolute;

    bottom:220px;

    background:#00ffff;

    border-radius:10px;

    box-shadow:0 0 25px #00ffff;

    animation:drive 12s linear infinite;
}

@keyframes drive{
    from{
        left:-100px;
    }

    to{
        left:110%;
    }
}

/* Activity Panel */

.panel{
    position:absolute;

    right:20px;
    bottom:20px;

    width:300px;
    height:250px;

    background:rgba(0,0,0,.5);

    border:1px solid #00ffff;

    padding:15px;

    box-shadow:0 0 20px #00ffff;
}

.panel h3{
    color:#00ffff;
    margin-bottom:10px;
}

.log{
    margin-bottom:8px;
    color:#ddd;
}

/* Stars */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
}

</style>
</head>

<body>

<div class="header">
🌆 FLOW CITY CYBER EDITION
</div>

<div class="city">

<div class="building tm">
T&M FLOW
</div>

<div class="building material">
MATERIALS
</div>

<div class="building ai">
AI AGENTS
</div>

<div class="building approvals">
APPROVALS
</div>

<div class="building reporting">
REPORTING
</div>

<div class="control">
<h2>CONTROL CENTER</h2>
<br>
Active Flows: 3
<br><br>
System Status: ✅ Online
</div>

<div class="truck"></div>

<div class="panel">
<h3>LIVE ACTIVITY</h3>

<div class="log">08:58 T&M Started</div>
<div class="log">08:59 Materials Updated</div>
<div class="log">09:00 Approval Triggered</div>
<div class="log">09:01 AI Agent Running</div>
<div class="log">09:02 Report Generated</div>
</div>

</div>

<script>

/* create stars */

for(let i=0;i<120;i++){

let star=document.createElement('div');

star.className='star';

star.style.left=Math.random()*100+'vw';

star.style.top=Math.random()*100+'vh';

document.body.appendChild(star);

}

</script>

</body>
</html>

</style>
</head>

<div class="city">

</div>

</body>
</html>
